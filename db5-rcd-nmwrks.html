<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUB5 - Numworks Scripts Manager</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&amp;display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root {
    --line: rgba(224, 242, 254, 0.16);
    --line-strong: rgba(224, 242, 254, 0.30);
    --ink: rgb(226, 240, 255);
    --ink-dim: rgba(226, 240, 255, 0.60);
    --ink-faint: rgba(226, 240, 255, 0.38);
    --glass: rgba(9, 13, 38, 0.62);
    --glass-hover: rgba(13, 19, 50, 0.72);
    --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.09);
    --glass-shadow: 0 18px 40px -26px rgba(0, 0, 0, 1);
    --glass-blur: blur(16px) saturate(160%);
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #fb7185;
    --info: #4cc9f0;
    --r-pill: 999px;
    --r-panel: 18px;
    --r-chip: 12px;
    --dur: 300ms;
    --ease: ease-in-out;
    --font-display: 'DM Serif Display', Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', 'Consolas', 'Monaco', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }

  ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  .CodeMirror-vscrollbar, .CodeMirror-hscrollbar { display: none !important; }
  .CodeMirror-scroll { overflow: auto !important; -ms-overflow-style: none; scrollbar-width: none; }
  .CodeMirror-scroll::-webkit-scrollbar { display: none; }

  body {
    font-family: var(--font-ui);
    background: radial-gradient(140% 100% at 50% -10%, #0b1150 0%, #050833 42%, #01030f 100%);
    color: var(--ink);
    height: 100vh;
    overflow: hidden;
    position: relative;
    isolation: isolate;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(42% 34% at 16% 10%, rgba(70, 110, 255, 0.20), transparent 68%),
      radial-gradient(38% 30% at 86% 16%, rgba(150, 80, 255, 0.15), transparent 66%),
      radial-gradient(58% 42% at 52% 108%, rgba(0, 130, 230, 0.18), transparent 72%);
    filter: blur(26px);
  }

  .stars {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%; pointer-events: none; display: block;
  }

  .glass {
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }

  .hidden { display: none !important; }

  /* =========================================================
     LANDING SCREEN — minimal, no gradient on the play button
     ========================================================= */
  .landing-screen {
    position: fixed; inset: 0; display: grid; place-items: center;
    z-index: 50; padding: 24px;
  }

  .landing-card {
    width: min(92vw, 540px);
    padding: 3.4rem 2.25rem 3.2rem;
    border-radius: 26px;
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), 0 30px 90px -30px rgba(0, 0, 0, 1);
    text-align: center;
    opacity: 0;
    animation: card-in 600ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .landing-card h1 {
    font-family: var(--font-display);
    font-size: clamp(4.8rem, 12vw, 8rem);
    line-height: 0.92;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: #fff;
    text-shadow: 0 0 60px rgba(120, 170, 255, 0.28);
  }

  .landing-stars {
    margin-top: 1rem;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    letter-spacing: 0.28em;
    color: rgba(226, 240, 255, 0.9);
    text-shadow: 0 0 22px rgba(160, 200, 255, 0.45);
  }

  .landing-tagline {
    margin-top: 1.2rem;
    font-size: 0.88rem;
    color: var(--ink-dim);
    letter-spacing: 0.03em;
  }

  /* ---- Minimal DUB5 play button ---- */
  .landing-enter {
    margin-top: 2.25rem;
    width: 76px;
    height: 76px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    color: #fff;
    background: var(--glass);
    border: 1px solid var(--line);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    transition:
      border-color var(--dur) var(--ease),
      background var(--dur) var(--ease),
      transform var(--dur) var(--ease),
      box-shadow var(--dur) var(--ease);
    position: relative;
  }

  .landing-enter:hover,
  .landing-enter:focus-visible {
    background: var(--glass-hover);
    border-color: var(--line-strong);
    transform: translateY(-2px);
    outline: none;
    box-shadow:
      var(--glass-inset),
      0 22px 44px -22px rgba(190, 215, 255, 0.35),
      0 18px 40px -26px rgba(0, 0, 0, 1);
  }

  .landing-enter:active {
    transform: translateY(0);
  }

  .landing-enter:focus-visible {
    outline: 2px solid rgba(224, 242, 254, 0.8);
    outline-offset: 3px;
  }

  .landing-enter svg {
    width: 26px;
    height: 26px;
    margin-left: 4px;
    fill: currentColor;
    stroke: none;
    transition: transform var(--dur) var(--ease);
  }

  .landing-enter:hover svg {
    transform: scale(1.06);
  }

  /* =========================================================
     APP SHELL
     ========================================================= */
  .app-shell {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 22px;
    background: rgba(6, 9, 28, 0.55);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 12px 32px -20px rgba(0, 0, 0, 1);
    z-index: 5;
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }

  .brand-mini {
    font-family: var(--font-display);
    font-size: clamp(1.25rem, 2vw, 1.7rem);
    font-weight: 400;
    letter-spacing: 0.03em;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 10px 4px 4px;
    border-radius: var(--r-pill);
    transition: background var(--dur) var(--ease);
  }

  .brand-mini svg { width: 22px; height: 22px; color: rgba(226, 240, 255, 0.85); }

  .status {
    display: flex; align-items: center; gap: 10px;
    font-size: 0.9rem; color: var(--ink);
    padding: 0.5rem 0.95rem;
    border-radius: var(--r-pill);
    background: var(--glass);
    border: 1px solid var(--line);
    box-shadow: var(--glass-inset);
    min-width: 220px;
    justify-content: center;
  }

  .status-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--danger);
    box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.15), 0 0 12px rgba(251, 113, 133, 0.5);
    flex: 0 0 auto;
    transition: background 300ms ease, box-shadow 300ms ease;
  }

  .status-dot.connected {
    background: var(--success);
    box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.15), 0 0 12px rgba(52, 211, 153, 0.6);
  }

  .status-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* =========================================================
     BUTTONS
     ========================================================= */
  button {
    appearance: none; font: inherit;
    background: var(--glass);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 0.68rem 0.95rem;
    border-radius: var(--r-chip);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition:
      transform var(--dur) var(--ease),
      background var(--dur) var(--ease),
      border-color var(--dur) var(--ease),
      box-shadow var(--dur) var(--ease);
    box-shadow: var(--glass-inset);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  button:hover {
    background: var(--glass-hover);
    border-color: var(--line-strong);
    transform: translateY(-2px);
    box-shadow: var(--glass-inset), 0 12px 26px -18px rgba(0, 0, 0, 1);
  }

  button:active { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  button:focus-visible {
    outline: 2px solid rgba(224, 242, 254, 0.8);
    outline-offset: 3px;
  }

  button.primary {
    background: linear-gradient(180deg, rgba(190, 215, 255, 0.22), rgba(190, 215, 255, 0.08));
    border-color: rgba(190, 215, 255, 0.45);
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }

  .icon-btn { width: 44px; height: 44px; padding: 0; border-radius: var(--r-chip); }
  .icon-btn.small { width: 36px; height: 36px; border-radius: 10px; }

  .icon-btn svg, .tab-close svg, .status-pill svg, .market-action svg,
  .tree-script-left svg, .tree-version-left svg, .tab svg, .notification svg {
    width: 20px; height: 20px;
    fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    flex: 0 0 auto;
  }

  /* =========================================================
     MAIN GRID
     ========================================================= */
  .main-content {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 310px;
    gap: 1rem;
    flex: 1;
    overflow: hidden;
    position: relative;
    z-index: 2;
    padding: 1rem;
    min-height: 0;
  }

  .sidebar-left, .sidebar-right, .editor-area {
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    min-height: 0;
  }

  .sidebar-left, .sidebar-right {
    border-radius: var(--r-panel);
    display: flex; flex-direction: column; overflow: hidden;
  }

  .editor-area {
    border-radius: var(--r-panel);
    display: flex; flex-direction: column; overflow: hidden; min-width: 0;
  }

  .sidebar-header, .editor-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.025);
  }

  .sidebar-header span:first-child {
    font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.16em;
    color: rgba(226, 240, 255, 0.75);
  }

  .header-actions, .editor-actions { display: flex; gap: 8px; align-items: center; }

  /* ---------- TREE ---------- */
  .tree-scroll, .market-scroll {
    flex: 1; overflow-y: auto; padding: 10px; min-height: 0;
  }

  .tree-node {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    border-radius: var(--r-chip);
    overflow: hidden; margin-bottom: 8px;
    transition: border-color 220ms ease, box-shadow 220ms ease;
  }

  .tree-node.active {
    border-color: rgba(190, 215, 255, 0.55);
    box-shadow: 0 0 0 2px rgba(190, 215, 255, 0.1), 0 12px 30px -20px rgba(0, 0, 0, 1);
  }

  .tree-script-row, .tree-version-row {
    width: 100%; border: none; background: transparent; box-shadow: none;
    justify-content: space-between; text-align: left;
    border-radius: 0; padding: 0.75rem 0.85rem;
    color: var(--ink); font-weight: 600; font-size: 0.88rem;
  }

  .tree-script-row:hover, .tree-version-row:hover {
    background: rgba(255, 255, 255, 0.06);
    transform: none; box-shadow: none; border-color: transparent;
  }

  .tree-script-left, .tree-version-left {
    display: flex; align-items: center; gap: 0.55rem; min-width: 0;
  }

  .tree-script-left svg, .tree-version-left svg {
    width: 16px; height: 16px; color: rgba(226, 240, 255, 0.6);
  }

  .tree-script-name, .tree-version-name, .market-name {
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .tree-script-meta, .tree-version-meta {
    color: var(--ink-dim); font-size: 0.72rem;
    white-space: nowrap; flex: 0 0 auto;
    font-weight: 600; letter-spacing: 0.02em;
  }

  .tree-versions {
    border-top: 1px solid var(--line);
    padding: 0.35rem 0 0.45rem;
    display: none; background: rgba(0, 0, 0, 0.12);
  }

  .tree-node.expanded .tree-versions { display: block; }
  .tree-node.expanded .caret { transform: rotate(90deg); }
  .caret { transition: transform 0.18s ease; opacity: 0.75; }

  .tree-version-row {
    padding-left: 1.9rem; font-weight: 500;
    color: rgba(226, 240, 255, 0.8); font-size: 0.82rem;
  }

  .tree-version-row.current {
    background: rgba(190, 215, 255, 0.08);
    box-shadow: inset 3px 0 0 rgba(190, 215, 255, 0.55);
  }

  .tree-version-row.published .tree-version-meta { color: rgba(52, 211, 153, 0.95); }

  .empty-state {
    padding: 1.35rem 1rem; text-align: center;
    color: var(--ink-dim); font-size: 0.85rem; line-height: 1.55;
  }

  /* ---------- TABS ---------- */
  .tabs {
    display: flex; gap: 0.4rem;
    padding: 0.6rem 0.6rem 0;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.015);
    min-height: 50px;
  }

  .tab {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border-radius: 12px 12px 0 0;
    border: 1px solid var(--line); border-bottom: none;
    padding: 0.6rem 0.8rem;
    background: rgba(255, 255, 255, 0.03);
    color: rgba(226, 240, 255, 0.75);
    min-width: 0; max-width: 260px; flex: 0 0 auto;
    box-shadow: none; font-weight: 600; font-size: 0.82rem;
  }

  .tab.active {
    background: var(--glass); color: #fff;
    border-color: var(--line-strong);
    transform: translateY(1px);
    box-shadow: var(--glass-inset);
  }

  .tab svg { width: 15px; height: 15px; color: rgba(226, 240, 255, 0.55); }
  .tab.active svg { color: rgba(226, 240, 255, 0.9); }

  .tab-title {
    min-width: 0; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 180px;
  }

  .tab-dirty {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warning);
    box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
    flex: 0 0 auto;
  }

  .tab-close {
    width: 22px; height: 22px; border-radius: 50%; padding: 0;
    margin-left: 0.25rem; background: transparent;
    border-color: transparent; color: rgba(226, 240, 255, 0.6);
    box-shadow: none; min-width: 0;
  }

  .tab-close:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: transparent; transform: none; box-shadow: none;
  }

  .tab-close svg { width: 12px; height: 12px; }

  /* ---------- EDITOR ---------- */
  .editor-meta {
    display: flex; align-items: center; gap: 10px;
    min-width: 0; flex: 1;
  }

  .script-name-input {
    background: transparent; border: none; color: #fff;
    font-size: 0.98rem; font-weight: 600;
    flex: 1; outline: none; min-width: 0;
    text-overflow: ellipsis; padding: 4px 6px;
    border-radius: 6px;
    transition: background 200ms ease, box-shadow 200ms ease;
    font-family: var(--font-ui);
  }

  .script-name-input::placeholder { color: var(--ink-faint); }
  .script-name-input:focus {
    background: rgba(255, 255, 255, 0.04);
    box-shadow: inset 0 -2px 0 rgba(190, 215, 255, 0.5);
  }
  .script-name-input:disabled { color: var(--ink-dim); cursor: default; }

  .unsaved-indicator {
    color: var(--warning); font-size: 0.78rem;
    display: inline-flex; align-items: center; gap: 0.35rem;
    white-space: nowrap; flex: 0 0 auto; font-weight: 600;
  }

  .editor-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .CodeMirror {
    flex: 1; height: auto !important;
    font-family: var(--font-mono); font-size: 13.5px;
    background: rgba(2, 4, 16, 0.5); color: #e2f0ff; line-height: 1.6;
  }

  .CodeMirror-gutters {
    background: rgba(255, 255, 255, 0.02);
    border-right: 1px solid var(--line);
  }

  .CodeMirror-linenumber { color: rgba(226, 240, 255, 0.28); }
  .CodeMirror-cursor { border-left: 2px solid #cfe3ff !important; }
  .CodeMirror-selected { background: rgba(96, 165, 250, 0.22) !important; }

  .cm-s-dracula.CodeMirror,
  .cm-s-dracula .CodeMirror-gutters {
    background: transparent !important; color: #e2f0ff;
  }

  .cm-s-dracula .cm-keyword { color: #a78bfa; }
  .cm-s-dracula .cm-def { color: #4cc9f0; }
  .cm-s-dracula .cm-string { color: #34d399; }
  .cm-s-dracula .cm-number { color: #fbbf24; }
  .cm-s-dracula .cm-comment { color: rgba(226, 240, 255, 0.4); font-style: italic; }
  .cm-s-dracula .cm-operator { color: #fb7185; }
  .cm-s-dracula .cm-builtin { color: #4cc9f0; }

  /* ---------- MARKETPLACE ---------- */
  .market-search { display: flex; gap: 8px; padding: 12px 12px 0; }

  .market-search input, .modal-input {
    width: 100%; padding: 0.78rem 0.95rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--line); color: var(--ink);
    border-radius: var(--r-chip); outline: none;
    font-size: 0.9rem; font-family: inherit;
    transition: border-color 200ms ease, background 200ms ease, box-shadow 200ms ease;
  }

  .market-search input::placeholder, .modal-input::placeholder {
    color: var(--ink-faint);
  }

  .market-search input:focus, .modal-input:focus {
    border-color: rgba(190, 215, 255, 0.5);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 0 3px rgba(190, 215, 255, 0.1);
  }

  .market-results { padding: 0.75rem 0.8rem 1rem; }

  .market-card {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    border-radius: var(--r-chip);
    padding: 0.85rem; margin-bottom: 0.65rem;
    display: flex; flex-direction: column; gap: 0.7rem;
    transition: border-color 200ms ease, background 200ms ease;
  }

  .market-card:hover {
    border-color: var(--line-strong);
    background: rgba(255, 255, 255, 0.05);
  }

  .market-row {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 12px;
  }

  .market-title {
    font-size: 0.92rem; font-weight: 700; color: #fff;
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .market-subtitle {
    margin-top: 0.25rem; font-size: 0.78rem;
    color: var(--ink-dim); line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .market-action { width: 38px; height: 38px; border-radius: 10px; padding: 0; flex: 0 0 auto; }
  .market-action svg { width: 16px; height: 16px; }

  /* ---------- NOTIFICATIONS ---------- */
  #notification-area {
    position: fixed; bottom: 20px; right: 20px;
    display: flex; flex-direction: column; gap: 8px;
    z-index: 1000; pointer-events: none;
  }

  .notification {
    padding: 12px 16px; border-radius: var(--r-chip);
    color: #fff; font-weight: 600; font-size: 0.88rem;
    animation: slideIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: var(--glass-inset), 0 14px 40px -14px rgba(0, 0, 0, 1);
    max-width: 420px; display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); pointer-events: auto;
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
  }

  .notification svg { width: 16px; height: 16px; stroke: currentColor; fill: none; flex: 0 0 auto; }
  .notification.info { background: linear-gradient(180deg, rgba(76, 201, 240, 0.95), rgba(26, 122, 158, 0.95)); }
  .notification.success { background: linear-gradient(180deg, rgba(52, 211, 153, 0.95), rgba(15, 155, 108, 0.95)); }
  .notification.error { background: linear-gradient(180deg, rgba(251, 113, 133, 0.95), rgba(190, 18, 60, 0.95)); }
  .notification.warning { background: linear-gradient(180deg, rgba(251, 191, 36, 0.95), rgba(180, 83, 9, 0.95)); color: #1a1000; }

  @keyframes slideIn {
    from { transform: translateX(120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(3, 5, 20, 0.78);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);

<script>
(function starfield() {
  const canvas = document.getElementById('stars');
  if (!canvas) return;
  const ctx = canvas.getContext('2d', { alpha: true });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TINTS = [[255,255,255],[205,222,255],[255,236,214],[186,205,255]];
  const BASE_SIZE = [1.8, 3.2, 6.4, 11];
  const spriteCache = new Map();
  let flareSprite = null;
  let W = 0, H = 0, dpr = 1;
  let stars = [];
  let shooting = null;
  let nextShot = 3200;
  let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
  let lastT = performance.now();
  let rafId = null;

  function getSprite(tint, bucket) {
    const key = tint + ':' + bucket;
    const cached = spriteCache.get(key);
    if (cached) return cached;
    const radius = [1.5, 2.6, 4.6, 7.4][bucket];
    const size = Math.max(2, Math.ceil(radius * 2));
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const g = c.getContext('2d');
    const t = TINTS[tint];
    const cx = size / 2;
    const grad = g.createRadialGradient(cx, cx, 0, cx, cx, cx);
    grad.addColorStop(0.00, 'rgba(255,255,255,1)');
    grad.addColorStop(0.14, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.80)');
    grad.addColorStop(0.38, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.20)');
    grad.addColorStop(0.72, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.04)');
    grad.addColorStop(1.00, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0)');
    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cx, cx, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.beginPath(); g.arc(cx, cx, Math.max(0.4, cx * 0.15), 0, Math.PI * 2); g.fill();
    spriteCache.set(key, c);
    return c;
  }

  function getFlare() {
    if (flareSprite) return flareSprite;
    const s = 64;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const g = c.getContext('2d');
    const mid = s / 2;
    const h = g.createLinearGradient(0, mid, s, mid);
    h.addColorStop(0, 'rgba(255,255,255,0)');
    h.addColorStop(0.5, 'rgba(255,255,255,0.8)');
    h.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = h; g.fillRect(0, mid - 0.55, s, 1.1);
    const v = g.createLinearGradient(mid, 0, mid, s);
    v.addColorStop(0, 'rgba(255,255,255,0)');
    v.addColorStop(0.5, 'rgba(255,255,255,0.8)');
    v.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = v; g.fillRect(mid - 0.55, 0, 1.1, s);
    flareSprite = c;
    return c;
  }

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const density = Math.round((W * H) / 1500);
    const count = Math.min(1500, Math.max(420, density));
    stars = [];
    for (let i = 0; i < count; i++) {
      const roll = Math.random();
      let bucket = 0;
      if (roll > 0.9955) bucket = 3;
      else if (roll > 0.972) bucket = 2;
      else if (roll > 0.85) bucket = 1;
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        depth: 0.25 + Math.random() * 0.75, bucket: bucket,
        tint: [0,0,0,1,3,2][Math.floor(Math.random() * 6)],
        base: 0.28 + Math.random() * 0.62,
        speed: 0.35 + Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2,
        angle: Math.random() * Math.PI,
        hasFlare: bucket === 3
      });
    }
  }

  function spawnShooting() {
    const goLeft = Math.random() > 0.5;
    const speed = 380 + Math.random() * 320;
    shooting = {
      x: W * (0.15 + Math.random() * 0.7),
      y: H * (0.05 + Math.random() * 0.35),
      vx: (goLeft ? -1 : 1) * speed * 0.85,
      vy: speed * 0.45, life: 0, max: 0.9 + Math.random() * 0.5
    };
  }

  function draw(now) {
    const t = now / 1000;
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    ctx.clearRect(0, 0, W, H);
    mouseX += (targetX - mouseX) * 0.045;
    mouseY += (targetY - mouseY) * 0.045;
    const px = mouseX * 16, py = mouseY * 16;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const twinkle = 0.7 + 0.3 * Math.sin(t * s.speed + s.phase);
      const alpha = Math.min(1, s.base * twinkle);
      const size = BASE_SIZE[s.bucket] * (0.6 + s.depth * 0.8);
      const x = s.x + px * s.depth;
      const y = s.y + py * s.depth;
      ctx.globalAlpha = alpha;
      ctx.drawImage(getSprite(s.tint, s.bucket), x - size / 2, y - size / 2, size, size);
      if (s.hasFlare) {
        const fs = size * 6;
        ctx.globalAlpha = alpha * 0.3;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(s.angle);
        ctx.drawImage(getFlare(), -fs / 2, -fs / 2, fs, fs);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;
    if (!reduceMotion) {
      if (!shooting) {
        nextShot -= dt * 1000;
        if (nextShot <= 0) { spawnShooting(); nextShot = 7000 + Math.random() * 12000; }
      } else {
        const p = shooting;
        p.x += p.vx * dt; p.y += p.vy * dt; p.life += dt;
        const tailX = p.x - p.vx * 0.13;
        const tailY = p.y - p.vy * 0.13;
        const fade = Math.max(0, 1 - p.life / p.max);
        const grad = ctx.createLinearGradient(p.x, p.y, tailX, tailY);
        grad.addColorStop(0, 'rgba(255,255,255,0.95)');
        grad.addColorStop(0.35, 'rgba(190,220,255,0.32)');
        grad.addColorStop(1, 'rgba(190,220,255,0)');
        ctx.globalAlpha = fade;
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
        ctx.globalAlpha = fade * 0.85;
        ctx.drawImage(getSprite(0, 3), p.x - 8, p.y - 8, 16, 16);
        ctx.globalAlpha = 1;
        if (p.life > p.max || p.x < -300 || p.x > W + 300 || p.y > H + 300) shooting = null;
      }
    }
  }

  function loop(now) { draw(now); rafId = requestAnimationFrame(loop); }
  function start() {
    if (rafId !== null) cancelAnimationFrame(rafId);
    lastT = performance.now();
    if (reduceMotion) { draw(performance.now()); rafId = null; return; }
    rafId = requestAnimationFrame(loop);
  }
  function stop() { if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; } }

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { build(); if (reduceMotion) draw(performance.now()); }, 140);
  });
  window.addEventListener('pointermove', function (e) {
    targetX = (e.clientX / W) * 2 - 1;
    targetY = (e.clientY / H) * 2 - 1;
  }, { passive: true });
  document.addEventListener('visibilitychange', function () {
    if (reduceMotion) return;
    if (document.hidden) stop(); else start();
  });
  build(); start();
})();
</script>

function icon(n) { return ICONS[n] || ''; }
function setIconButton(el, n) { if (el) el.innerHTML = icon(n); }

function generateUUID() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

async function sha256(msg) {
  const buf = new TextEncoder().encode(msg);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map(function(b) {
    return b.toString(16).padStart(2, '0');
  }).join('');
}

function amsParts(date) {
  date = date || new Date();
  const dtf = new Intl.DateTimeFormat('nl-NL', {
    timeZone: 'Europe/Amsterdam',
    day: 'numeric', month: 'numeric', year: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: false
  });
  const p = dtf.formatToParts(date);
  function g(t) { const f = p.find(function(x){ return x.type === t; }); return f ? f.value : '0'; }
  return { day: g('day'), month: g('month'), year: g('year'), hour: g('hour'), minute: g('minute') };
}

function amsFilename(date) {
  const p = amsParts(date);
  return p.day + '-' + p.month + '-' + p.year + '-' + p.hour + ':' + p.minute;
}

function amsDisplay(date) {
  const p = amsParts(date);
  return p.day + '-' + p.month + '-' + p.year + ' ' + p.hour + ':' + p.minute;
}

function defaultName() { return amsFilename() + '.py'; }

function ensurePy(n) {
  n = (n || '').trim();
  if (!n) return defaultName();
  if (!/\.py$/i.test(n)) n += '.py';
  return n;
}

function vLabel(v) { return 'v1.' + Math.max(0, v - 1); }

function tabTitle(name, v) { return v ? name + ' · ' + vLabel(v) : name; }

function notify(msg, type) {
  type = type || 'info';
  const area = document.getElementById('notification-area');
  const d = document.createElement('div');
  d.className = 'notification ' + type;
  const ic = type === 'success' ? 'check' : type === 'error' || type === 'warning' ? 'warning' : 'spark';
  d.innerHTML = icon(ic) + '<span>' + msg + '</span>';
  area.appendChild(d);
  setTimeout(function() { d.style.opacity = '0'; setTimeout(function() { d.remove(); }, 250); }, 3500);
}

function statusPill(msg, type) {
  type = type || 'info';
  const p = document.getElementById('market-status');
  p.className = 'status-pill ' + type;
  const ic = type === 'success' ? 'check' : type === 'error' ? 'warning' : 'spark';
  p.innerHTML = icon(ic) + '<span>' + msg + '</span>';
  p.classList.remove('hidden');
  clearTimeout(statusPill._t);
  statusPill._t = setTimeout(function() { p.classList.add('hidden'); }, 4000);
}

/* =========================================================
   IndexedDB
   ========================================================= */
function openDB() {
  return new Promise(function(resolve, reject) {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = function() { reject(req.error); };
    req.onsuccess = function() { resolve(req.result); };
    req.onupgradeneeded = function(e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('scripts')) db.createObjectStore('scripts', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('versions')) {
        const s = db.createObjectStore('versions', { keyPath: 'id' });
        s.createIndex('scriptId', 'scriptId', { unique: false });
      }
      if (!db.objectStoreNames.contains('restorePoints')) {
        const s = db.createObjectStore('restorePoints', { keyPath: 'id' });
        s.createIndex('scriptId', 'scriptId', { unique: false });
      }
    };
  });
}

function dbAll(store) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      const tx = db.transaction(store, 'readonly');
      const r = tx.objectStore(store).getAll();
      r.onsuccess = function() { res(r.result || []); };
      r.onerror = function() { rej(r.error); };
    });
  });
}

function dbPut(store, data) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      const tx = db.transaction(store, 'readwrite');
      const r = tx.objectStore(store).put(data);
      r.onsuccess = function() { res(); };
      r.onerror = function() { rej(r.error); };
    });
  });
}

function dbGet(store, id) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      const tx = db.transaction(store, 'readonly');
      const r = tx.objectStore(store).get(id);
      r.onsuccess = function() { res(r.result); };
      r.onerror = function() { rej(r.error); };
    });
  });
}

function dbDel(store, id) {
  return openDB().then(function(db) {
    return new Promise(function(res, rej) {
      const tx = db.transaction(store, 'readwrite');
      const r = tx.objectStore(store).delete(id);
      r.onsuccess = function() { res(); };
      r.onerror = function() { rej(r.error); };
    });
  });
}

/* =========================================================
   Calculator Manager
   ========================================================= */
class CalculatorManager {
  constructor() {
    this.device = null;
    this.isConnected = false;
    this.platformInfo = null;
  }

  getDeviceLabel() {
    if (!this.platformInfo) return 'NumWorks';
    return this.platformInfo.model || this.platformInfo.name || this.platformInfo.device || 'NumWorks';
  }

  connect() {
    const self = this;
    this.device = new Numworks();
    return new Promise(function(resolve, reject) {
      self.device.detect(function() {
        self.device.getPlatformInfo().then(function(info) {
          self.platformInfo = info;
          self.isConnected = true;
          resolve(info);
          notify('Connected to ' + self.getDeviceLabel(), 'success');
        }).catch(reject);
      }, function(err) {
        self.isConnected = false;
        notify('Connection failed: ' + (err.message || err), 'error');
        reject(err);
      });
    });
  }

  autoConnect() {
    const self = this;
    if (!this.device) this.device = new Numworks();
    return new Promise(function(resolve) {
      let done = false;
      function settle(v) { if (done) return; done = true; resolve(v); }
      self.device.autoConnect(function() {
        self.device.stopAutoConnect();
        self.device.getPlatformInfo().then(function(info) {
          self.platformInfo = info;
          self.isConnected = true;
          settle(info);
        }).catch(function() { settle(null); });
      });
      setTimeout(function() {
        try { self.device.stopAutoConnect(); } catch(e) {}
        self.isConnected = false;
        settle(null);
      }, 3000);
    });
  }

  getScripts() {
    if (!this.isConnected) return Promise.reject(new Error('Not connected'));
    return this.device.backupStorage().then(function(s) {
      return (s.records || []).filter(function(r) { return r.type === 'py'; }).map(function(r) {
        return { name: r.name, code: r.code, autoImport: r.autoImport };
      });
    });
  }

  uploadScript(name, code) {
    const self = this;
    if (!this.isConnected) return Promise.reject(new Error('Not connected'));
    return this.device.backupStorage().then(function(storage) {
      const records = Array.isArray(storage.records) ? storage.records : [];
      const i = records.findIndex(function(r) { return r.name === name && r.type === 'py'; });
      const rec = { name: name, type: 'py', autoImport: false, code: code };
      if (i >= 0) records[i] = rec; else records.push(rec);
      storage.records = records;
      return new Promise(function(res, rej) {
        try { self.device.installStorage(storage, function() { res(); }); } catch(e) { rej(e); }
      });
    }).then(function() {
      return self.device.backupStorage();
    }).then(function(verify) {
      const v = (verify.records || []).find(function(r) { return r.name === name && r.type === 'py'; });
      if (!v || v.code !== code) throw new Error('Verification failed');
      return true;
    });
  }
}
