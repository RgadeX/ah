const app = {
  state: {
    scripts: [], versions: [], restorePoints: [],
    openTabs: [], activeTabId: null, currentScriptId: null,
    unsavedChanges: false,
    calc: new CalculatorManager(),
    editor: null, suppressEditorChange: false,
    marketCache: [], marketQuery: '', marketplaceInitialized: false,
    contextMenuTarget: null
  },

  init: function() {
    const self = this;

    setIconButton(document.getElementById('btn-connect'), 'plug');
    setIconButton(document.getElementById('btn-upload'), 'upload');
    setIconButton(document.getElementById('btn-export'), 'zip');
    setIconButton(document.getElementById('btn-new-script'), 'plus');
    setIconButton(document.getElementById('btn-import-py'), 'import');
    setIconButton(document.getElementById('btn-save-version'), 'save');
    setIconButton(document.getElementById('btn-publish'), 'cloud');
    setIconButton(document.getElementById('btn-market-search'), 'search');
    setIconButton(document.getElementById('btn-market-refresh'), 'refresh');
    setIconButton(document.getElementById('btn-settings'), 'settings');

    Promise.all([dbAll('scripts'), dbAll('versions'), dbAll('restorePoints')])
      .then(function(res) {
        self.state.scripts = res[0];
        self.state.versions = res[1];
        self.state.restorePoints = res[2];
        self.initEditor();
        self.setupEvents();
        self.renderExplorer();
        self.renderTabs();
        self.updateEditorMeta();
        self.refreshMarket(true).catch(function() {});
        self.state.calc.autoConnect().then(function(info) {
          self.updateCalcStatus(!!info, info);
        });
        self.updateUI();
      })
      .catch(function(err) {
        console.error('Init failed:', err);
        notify('Failed to load local data', 'error');
      });
  },

  initEditor: function() {
    const self = this;
    this.state.editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
      mode: 'python', theme: 'dracula', lineNumbers: true,
      tabSize: 4, indentWithTabs: false, lineWrapping: true,
      viewportMargin: Infinity,
      extraKeys: {
        'Ctrl-S': function() { self.saveVersion(); },
        'Cmd-S': function() { self.saveVersion(); }
      }
    });
    const w = this.state.editor.getWrapperElement();
    w.style.display = 'flex';
    w.style.flex = '1';
    w.style.pointerEvents = 'auto';
    w.addEventListener('click', function() { self.state.editor.focus(); });

    let autosaveT;
    this.state.editor.on('change', function() {
      if (self.state.suppressEditorChange) return;
      const tab = self.getActiveTab();
      if (!tab || tab.readOnly) return;
      tab.content = self.state.editor.getValue();
      tab.dirty = true;
      self.state.unsavedChanges = true;
      self.updateUI();
      self.renderTabs();
      if (localStorage.getItem('dub5_autosave') === 'true') {
        clearTimeout(autosaveT);
        autosaveT = setTimeout(function() {
          self.saveVersion({ silent: true, force: false });
        }, 2000);
      }
    });
  },

  setupEvents: function() {
    const self = this;

    document.getElementById('btn-enter').addEventListener('click', function() {
      document.getElementById('landing-screen').classList.add('hidden');
      document.getElementById('app-shell').classList.remove('hidden');
      setTimeout(function() {
        if (self.state.editor) {
          self.state.editor.refresh();
          self.state.editor.focus();
        }
      }, 60);
    });

    document.getElementById('btn-connect').addEventListener('click', function() {
      self.state.calc.connect().then(function(info) {
        self.updateCalcStatus(true, info);
        return self.syncFromCalc();
      }).catch(function() {
        self.updateCalcStatus(false, null);
      });
    });

    document.getElementById('btn-new-script').addEventListener('click', function() {
      self.showModal('New script', [
        { id: 'name', label: 'Filename', type: 'text', placeholder: 'Leave blank for timestamp name' }
      ], function(data) {
        const name = ensurePy(data['name'] || '');
        if (self.state.scripts.some(function(s) { return s.name.toLowerCase() === name.toLowerCase(); })) {
          notify('That file already exists', 'error');
          return;
        }
        const script = {
          id: generateUUID(), name: name, activeVersionId: null,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          published: false, publishedAt: null
        };
        return dbPut('scripts', script).then(function() {
          self.state.scripts.push(script);
          self.renderExplorer();
          self.openTab(script.id);
          notify('Script created', 'success');
        });
      });
    });

    document.getElementById('btn-import-py').addEventListener('click', function() {
      document.getElementById('file-import').click();
    });

    document.getElementById('file-import').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function() {
        let name = ensurePy(file.name);
        if (self.state.scripts.some(function(s) { return s.name.toLowerCase() === name.toLowerCase(); })) {
          name = ensurePy(file.name.replace(/\.py$/i, '') + '_' + amsFilename());
        }
        const script = {
          id: generateUUID(), name: name, activeVersionId: null,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          published: false, publishedAt: null
        };
        dbPut('scripts', script).then(function() {
          self.state.scripts.push(script);
          self.renderExplorer();
          const tabId = self.openTab(script.id, { content: reader.result });
          self.setActiveTab(tabId, { force: true });
          notify('Imported Python file', 'success');
        });
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    document.getElementById('script-name-input').addEventListener('change', function(e) {
      if (!self.state.currentScriptId) return;
      const newName = ensurePy(e.target.value.trim());
      const script = self.state.scripts.find(function(s) { return s.id === self.state.currentScriptId; });
      if (!script) return;
      if (script.name.toLowerCase() === newName.toLowerCase()) {
        e.target.value = script.name;
        return;
      }
      if (self.state.scripts.some(function(s) { return s.id !== script.id && s.name.toLowerCase() === newName.toLowerCase(); })) {
        notify('Another file already uses that name', 'error');
        e.target.value = script.name;
        return;
      }
      script.name = newName;
      script.updatedAt = new Date().toISOString();
      dbPut('scripts', script).then(function() {
        self.updateTabLabels(script.id);
        self.renderExplorer();
        e.target.value = script.name;
        notify('Filename updated', 'success');
      });
    });

    document.getElementById('btn-save-version').addEventListener('click', function() { self.saveVersion(); });
    document.getElementById('btn-publish').addEventListener('click', function() { self.publish(); });
    document.getElementById('btn-upload').addEventListener('click', function() { self.loadToCalc(); });
    document.getElementById('btn-export').addEventListener('click', function() { self.exportAll(); });
    document.getElementById('btn-market-search').addEventListener('click', function() { self.refreshMarket(); });
    document.getElementById('btn-market-refresh').addEventListener('click', function() { self.refreshMarket(true); });

    document.getElementById('market-search-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') self.refreshMarket();
    });
    document.getElementById('market-search-input').addEventListener('input', function(e) {
      self.state.marketQuery = e.target.value;
      self.renderMarket();
    });

    document.getElementById('btn-settings').addEventListener('click', function() {
      const isAutosave = localStorage.getItem('dub5_autosave') === 'true';
      self.showModal('Settings', [
        { id: 'autosave', label: 'Enable Autosave (saves version after 2s of inactivity)', type: 'checkbox', checked: isAutosave }
      ], function(data) {
        localStorage.setItem('dub5_autosave', data['autosave'] === 'on' ? 'true' : 'false');
        notify('Settings saved', 'success');
      });
    });

    document.addEventListener('contextmenu', function(e) {
      const scriptRow = e.target.closest('.tree-script-row');
      const versionRow = e.target.closest('.tree-version-row');
      if (scriptRow) {
        e.preventDefault();
        const sid = scriptRow.closest('.tree-node').dataset.scriptId;
        self.showCtx(e.clientX, e.clientY, 'script', sid);
      } else if (versionRow) {
        e.preventDefault();
        const sid = versionRow.closest('.tree-node').dataset.scriptId;
        self.showCtx(e.clientX, e.clientY, 'version', versionRow.dataset.versionId, sid);
      } else {
        self.hideCtx();
      }
    });

    document.addEventListener('click', function() { self.hideCtx(); });

    document.getElementById('context-menu').addEventListener('click', function(e) {
      const item = e.target.closest('.context-menu-item');
      if (!item || !self.state.contextMenuTarget) return;
      const action = item.dataset.action;
      const sid = self.state.contextMenuTarget.scriptId;
      self.hideCtx();

      if (action === 'rename') {
        const script = self.getScript(sid);
        if (!script) return;
        const nn = prompt('Enter new filename (with .py):', script.name);
        if (!nn) return;
        const ensured = ensurePy(nn);
        if (self.state.scripts.some(function(s) { return s.id !== sid && s.name.toLowerCase() === ensured.toLowerCase(); })) {
          notify('A script with this name already exists', 'error');
          return;
        }
        script.name = ensured;
        script.updatedAt = new Date().toISOString();
        dbPut('scripts', script).then(function() {
          self.updateTabLabels(sid);
          self.renderExplorer();
          notify('Script renamed', 'success');
        });
      } else if (action === 'duplicate') {
        const script = self.getScript(sid);
        if (!script) return;
        const base = script.name.replace(/\.py$/i, '');
        let i = 1, nn = base + ' (' + i + ').py';
        while (self.state.scripts.some(function(s) { return s.name.toLowerCase() === nn.toLowerCase(); })) {
          i++; nn = base + ' (' + i + ').py';
        }
        const newScript = {
          id: generateUUID(), name: nn, activeVersionId: null,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          published: false, publishedAt: null
        };
        dbPut('scripts', newScript).then(function() {
          self.state.scripts.push(newScript);
          const latest = self.getLatest(sid);
          if (!latest) {
            self.renderExplorer();
            self.openTab(newScript.id);
            notify('Duplicated as ' + nn, 'success');
            return;
          }
          return sha256(latest.sourceCode).then(function(hash) {
            const v = {
              id: generateUUID(), scriptId: newScript.id, parentVersionId: null,
              branchId: 'main', versionNumber: 1,
              displayName: nn + ' (v1.0)', commitMessage: 'Duplicated',
              sourceCode: latest.sourceCode,
              createdAt: new Date().toISOString(),
              characterCount: latest.sourceCode.length,
              lineCount: latest.sourceCode.split('\n').length,
              sourceHash: hash, uploadedToCalculator: false, uploadedAt: null,
              published: false, publishedAt: null, publishedPath: null
            };
            return dbPut('versions', v).then(function() {
              self.state.versions.push(v);
              newScript.activeVersionId = v.id;
              return dbPut('scripts', newScript);
            }).then(function() {
              self.renderExplorer();
              self.openTab(newScript.id);
              notify('Duplicated as ' + nn, 'success');
            });
          });
        });
      } else if (action === 'delete') {
        const script = self.getScript(sid);
        if (!script) return;
        if (!confirm('Delete "' + script.name + '" and all its versions?')) return;
        const versions = self.getVersions(sid);
        const dels = versions.map(function(v) {
          return dbDel('versions', v.id).then(function() {
            const rps = self.state.restorePoints.filter(function(rp) { return rp.versionId === v.id; });
            return Promise.all(rps.map(function(rp) { return dbDel('restorePoints', rp.id); }));
          });
        });
        Promise.all(dels).then(function() {
          return dbDel('scripts', sid);
        }).then(function() {
          self.state.scripts = self.state.scripts.filter(function(s) { return s.id !== sid; });
          self.state.versions = self.state.versions.filter(function(v) { return v.scriptId !== sid; });
          self.state.restorePoints = self.state.restorePoints.filter(function(rp) { return rp.scriptId !== sid; });
          const open = self.state.openTabs.find(function(t) { return t.scriptId === sid; });
          if (open) self.closeTab(open.id);
          self.renderExplorer();
          notify('Script deleted', 'success');
        });
      }
    });

    window.addEventListener('beforeunload', function(e) {
      if (self.state.unsavedChanges) {
        e.preventDefault();
        e.returnValue = '';
      }
    });
  },

  showCtx: function(x, y, type, id, sid) {
    this.state.contextMenuTarget = { type: type, id: id, scriptId: sid };
    const m = document.getElementById('context-menu');
    m.style.left = x + 'px';
    m.style.top = y + 'px';
    m.classList.remove('hidden');
  },

  hideCtx: function() {
    this.state.contextMenuTarget = null;
    document.getElementById('context-menu').classList.add('hidden');
  },

  getActiveTab: function() {
    const id = this.state.activeTabId;
    return this.state.openTabs.find(function(t) { return t.id === id; }) || null;
  },

  getScript: function(sid) {
    return this.state.scripts.find(function(s) { return s.id === sid; }) || null;
  },

  getVersions: function(sid) {
    return this.state.versions.filter(function(v) { return v.scriptId === sid; })
      .sort(function(a, b) { return a.versionNumber - b.versionNumber; });
  },

  getVersion: function(sid, vid) {
    return this.state.versions.find(function(v) { return v.id === vid && v.scriptId === sid; }) || null;
  },

  getLatest: function(sid) {
    const vs = this.getVersions(sid);
    return vs.length ? vs[vs.length - 1] : null;
  },

  openTab: function(sid, opts) {
    opts = opts || {};
    const script = this.getScript(sid);
    if (!script) return null;
    const version = opts.versionId
      ? this.getVersion(sid, opts.versionId)
      : this.getVersion(sid, script.activeVersionId) || this.getLatest(sid);
    const key = sid + ':' + (version ? version.id : 'draft') + ':' + (opts.remote ? 'r' : 'l');
    const existing = this.state.openTabs.find(function(t) { return t.key === key; });
    if (existing) { this.setActiveTab(existing.id); return existing.id; }
    const tab = {
      id: generateUUID(), key: key, scriptId: sid,
      versionId: version ? version.id : null,
      title: tabTitle(script.name, version ? version.versionNumber : null),
      content: typeof opts.content === 'string' ? opts.content : (version ? version.sourceCode : ''),
      dirty: false, remote: !!opts.remote, readOnly: !!opts.remote
    };
    this.state.openTabs.push(tab);
    this.setActiveTab(tab.id, { force: true });
    return tab.id;
  },

  openRemote: function(name, content) {
    const key = 'mkt:' + name;
    const existing = this.state.openTabs.find(function(t) { return t.key === key; });
    if (existing) { this.setActiveTab(existing.id); return existing.id; }
    const tab = {
      id: generateUUID(), key: key, scriptId: null, versionId: null,
      title: name, content: content || '', dirty: false,
      remote: true, readOnly: true
    };
    this.state.openTabs.push(tab);
    this.setActiveTab(tab.id, { force: true });
    return tab.id;
  },

  setActiveTab: function(tabId, opts) {
    opts = opts || {};
    const self = this;
    const tab = this.state.openTabs.find(function(t) { return t.id === tabId; });
    if (!tab) return;
    const current = this.getActiveTab();
    if (current && current.id !== tab.id && !opts.force && !current.readOnly) {
      current.content = this.state.editor.getValue();
      current.dirty = current.content !== this.getSavedContent(current);
    }
    this.state.activeTabId = tabId;
    this.state.currentScriptId = tab.scriptId;
    this.refreshEditor();
    this.renderTabs();
    this.renderExplorer();
    this.updateEditorMeta();
    this.updateUI();
  },

  getSavedContent: function(tab) {
    if (!tab) return '';
    if (tab.remote) return tab.content || '';
    const script = this.getScript(tab.scriptId);
    if (!script) return tab.content || '';
    const v = tab.versionId ? this.getVersion(tab.scriptId, tab.versionId) : null;
    return v ? v.sourceCode : (tab.content || '');
  },

  refreshEditor: function() {
    const self = this;
    const tab = this.getActiveTab();
    const nameInput = document.getElementById('script-name-input');
    const roHint = document.getElementById('readonly-hint');
    if (!tab) {
      this.state.editor.setValue('');
      nameInput.value = '';
      nameInput.disabled = true;
      roHint.classList.add('hidden');
      this.state.unsavedChanges = false;
      this.updateUI();
      return;
    }
    const content = tab.remote ? tab.content : (tab.content || '');
    this.state.suppressEditorChange = true;
    this.state.editor.setValue(content);
    this.state.suppressEditorChange = false;
    nameInput.value = tab.scriptId ? ((this.getScript(tab.scriptId) || {}).name || '') : tab.title;
    nameInput.disabled = !!tab.readOnly || !tab.scriptId;
    roHint.classList.toggle('hidden', !tab.readOnly);
    this.state.unsavedChanges = !!tab.dirty && !tab.readOnly;
    this.state.editor.setOption('readOnly', tab.readOnly ? 'nocursor' : false);
    this.state.editor.refresh();
    setTimeout(function() { self.state.editor.focus(); }, 50);
  },

  updateEditorMeta: function() {
    const tab = this.getActiveTab();
    const nameInput = document.getElementById('script-name-input');
    const roHint = document.getElementById('readonly-hint');
    if (!tab) {
      nameInput.value = '';
      nameInput.disabled = true;
      roHint.classList.add('hidden');
      return;
    }
    if (tab.scriptId) {
      const s = this.getScript(tab.scriptId);
      nameInput.value = s ? s.name : tab.title;
      nameInput.disabled = tab.readOnly;
    } else {
      nameInput.value = tab.title;
      nameInput.disabled = true;
    }
    roHint.classList.toggle('hidden', !tab.readOnly);
  },

  renderTabs: function() {
    const self = this;
    const strip = document.getElementById('tab-strip');
    strip.innerHTML = '';
    if (!this.state.openTabs.length) return;
    this.state.openTabs.forEach(function(tab) {
      const el = document.createElement('button');
      el.className = 'tab' + (tab.id === self.state.activeTabId ? ' active' : '');
      el.title = tab.title;
      el.innerHTML =
        '<span class="tree-version-left" style="gap:0.45rem; min-width:0; flex:1;">' +
          icon(tab.remote ? 'eye' : 'file') +
          '<span class="tab-title">' + tab.title + '</span>' +
          (tab.dirty ? '<span class="tab-dirty"></span>' : '') +
        '</span>' +
        '<span class="tab-close">' + icon('close') + '</span>';
      el.addEventListener('click', function(e) {
        if (e.target.closest('.tab-close')) {
          e.stopPropagation();
          self.closeTab(tab.id);
          return;
        }
        self.setActiveTab(tab.id);
      });
      strip.appendChild(el);
    });
  },

  closeTab: function(tabId) {
    const self = this;
    const tab = this.state.openTabs.find(function(t) { return t.id === tabId; });
    if (!tab) return;
    if (tab.dirty && !tab.readOnly) {
      if (!confirm('This tab has unsaved changes. Close anyway?')) return;
    }
    const i = this.state.openTabs.findIndex(function(t) { return t.id === tabId; });
    this.state.openTabs.splice(i, 1);
    if (this.state.activeTabId === tabId) {
      const next = this.state.openTabs[Math.max(0, i - 1)] || this.state.openTabs[0] || null;
      if (next) {
        this.setActiveTab(next.id, { force: true });
      } else {
        this.state.activeTabId = null;
        this.state.currentScriptId = null;
        this.state.editor.setValue('');
        this.updateEditorMeta();
        this.updateUI();
        this.renderTabs();
        this.renderExplorer();
      }
    } else {
      this.renderTabs();
      this.renderExplorer();
    }
  },

  updateTabLabels: function(sid) {
    const self = this;
    const script = this.getScript(sid);
    if (!script) return;
    this.state.openTabs.filter(function(t) { return t.scriptId === sid; }).forEach(function(tab) {
      const v = tab.versionId ? self.getVersion(sid, tab.versionId) : null;
      tab.title = tabTitle(script.name, v ? v.versionNumber : null);
    });
    this.renderTabs();
    this.updateEditorMeta();
  },

  loadVersion: function(sid, vid) {
    const script = this.getScript(sid);
    if (!script) return;
    const version = vid ? this.getVersion(sid, vid) : this.getLatest(sid);
    if (this.state.unsavedChanges) {
      if (!confirm('You have unsaved changes. Open the selected file anyway?')) return;
    }
    const content = version ? version.sourceCode : '';
    const tabId = this.openTab(sid, { versionId: version ? version.id : null, content: content });
    if (tabId) this.setActiveTab(tabId, { force: true });
  },

  saveVersion: function(opts) {
    opts = opts || {};
    const self = this;
    const tab = this.getActiveTab();
    if (!tab || tab.readOnly || !tab.scriptId) {
      notify('Open a local script before saving', 'warning');
      return Promise.resolve(null);
    }
    const script = this.getScript(tab.scriptId);
    if (!script) return Promise.resolve(null);
    const code = this.state.editor.getValue();

    return sha256(code).then(function(hash) {
      return dbGet('versions', tab.versionId).then(function(cur) {
        if (cur && cur.sourceHash === hash && !opts.force) {
          if (!opts.silent) notify('No changes detected', 'warning');
          return cur;
        }
        const vs = self.getVersions(script.id);
        const nextNum = vs.length ? Math.max.apply(null, vs.map(function(v) { return v.versionNumber; })) + 1 : 1;
        const version = {
          id: generateUUID(), scriptId: script.id,
          parentVersionId: cur ? cur.id : null,
          branchId: cur ? cur.branchId : 'main',
          versionNumber: nextNum,
          displayName: script.name + ' (' + vLabel(nextNum) + ')',
          commitMessage: opts.commitMessage || '',
          sourceCode: code,
          createdAt: new Date().toISOString(),
          characterCount: code.length,
          lineCount: code.split('\n').length,
          sourceHash: hash,
          uploadedToCalculator: false, uploadedAt: null,
          published: false, publishedAt: null, publishedPath: null
        };
        return dbPut('versions', version).then(function() {
          self.state.versions.push(version);
          script.activeVersionId = version.id;
          script.updatedAt = new Date().toISOString();
          return dbPut('scripts', script);
        }).then(function() {
          const rp = {
            id: generateUUID(), scriptId: script.id, versionId: version.id,
            name: script.name + ' ' + amsDisplay(new Date()),
            description: 'Automatic restore point',
            createdAt: new Date().toISOString()
          };
          return dbPut('restorePoints', rp).then(function() {
            self.state.restorePoints.push(rp);
          });
        }).then(function() {
          tab.versionId = version.id;
          tab.content = code;
          tab.dirty = false;
          tab.title = tabTitle(script.name, version.versionNumber);
          self.state.unsavedChanges = false;
          self.renderExplorer();
          self.renderTabs();
          self.updateEditorMeta();
          self.updateUI();
          if (!opts.silent) notify('Version saved', 'success');
          return version;
        });
      });
    });
  },

  loadToCalc: function() {
    const self = this;
    const tab = this.getActiveTab();
    if (!tab || tab.readOnly) {
      notify('Open a local script first', 'warning');
      return;
    }
    if (!this.state.calc.isConnected) {
      notify('Please connect the calculator first', 'warning');
      return;
    }
    const script = this.getScript(tab.scriptId);
    if (!script) return;
    const code = this.state.editor.getValue();
    const doUpload = function() {
      return self.state.calc.getScripts().then(function(list) {
        const exists = list.some(function(s) { return s.name.toLowerCase() === script.name.toLowerCase(); });
        const msg = exists
          ? 'Load "' + script.name + '" to the calculator? This will overwrite the existing file.'
          : 'Load "' + script.name + '" to the calculator as a new file?';
        if (!confirm(msg)) return;
        notify('Uploading to calculator...', 'info');
        return self.state.calc.uploadScript(script.name, code).then(function() {
          return tab.versionId ? dbGet('versions', tab.versionId) : null;
        }).then(function(v) {
          if (v) {
            v.uploadedToCalculator = true;
            v.uploadedAt = new Date().toISOString();
            return dbPut('versions', v);
          }
        }).then(function() {
          notify('Uploaded and verified successfully', 'success');
          self.renderExplorer();
        }).catch(function(e) {
          notify('Upload failed: ' + e.message, 'error');
        });
      }).catch(function(e) {
        notify('Upload failed: ' + e.message, 'error');
      });
    };
    if (tab.dirty) {
      this.saveVersion({ silent: true, force: true }).then(doUpload);
    } else {
      doUpload();
    }
  },

  syncFromCalc: function() {
    const self = this;
    return this.state.calc.getScripts().then(function(list) {
      return Promise.all(list.map(function(cs) {
        return sha256(cs.code).then(function(hash) {
          const name = ensurePy(cs.name);
          const existing = self.state.scripts.find(function(s) { return s.name === name; });
          if (!existing) {
            const script = {
              id: generateUUID(), name: name, activeVersionId: null,
              createdAt: new Date().toISOString(),
              updatedAt: new Date().toISOString(),
              published: false, publishedAt: null
            };
            return dbPut('scripts', script).then(function() {
              self.state.scripts.push(script);
              const v = {
                id: generateUUID(), scriptId: script.id,
                parentVersionId: null, branchId: 'main', versionNumber: 1,
                displayName: name + ' (v1.0)', commitMessage: 'Imported from calculator',
                sourceCode: cs.code, createdAt: new Date().toISOString(),
                characterCount: cs.code.length, lineCount: cs.code.split('\n').length,
                sourceHash: hash, uploadedToCalculator: true, uploadedAt: new Date().toISOString(),
                published: false, publishedAt: null, publishedPath: null
              };
              return dbPut('versions', v).then(function() {
                self.state.versions.push(v);
                script.activeVersionId = v.id;
                return dbPut('scripts', script);
              });
            });
          }
          return dbGet('versions', existing.activeVersionId).then(function(av) {
            if (av && av.sourceHash === hash) return null;
            const vs = self.getVersions(existing.id);
            const n = vs.length ? Math.max.apply(null, vs.map(function(v) { return v.versionNumber; })) + 1 : 1;
            const v = {
              id: generateUUID(), scriptId: existing.id,
              parentVersionId: existing.activeVersionId,
              branchId: av ? av.branchId : 'main',
              versionNumber: n,
              displayName: existing.name + ' (' + vLabel(n) + ')',
              commitMessage: 'Synced from device',
              sourceCode: cs.code, createdAt: new Date().toISOString(),
              characterCount: cs.code.length, lineCount: cs.code.split('\n').length,
              sourceHash: hash, uploadedToCalculator: true, uploadedAt: new Date().toISOString(),
              published: false, publishedAt: null, publishedPath: null
            };
            return dbPut('versions', v).then(function() {
              self.state.versions.push(v);
              existing.activeVersionId = v.id;
              existing.updatedAt = new Date().toISOString();
              return dbPut('scripts', existing);
            });
          });
        });
      })).then(function() {
        return Promise.all([dbAll('scripts'), dbAll('versions')]);
      }).then(function(res) {
        self.state.scripts = res[0];
        self.state.versions = res[1];
        self.renderExplorer();
        notify('Calculator scripts synchronized', 'success');
      });
    }).catch(function(e) {
      notify('Sync failed: ' + e.message, 'error');
    });
  },

  updateCalcStatus: function(connected, info) {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    const btn = document.getElementById('btn-connect');
    if (connected) {
      dot.classList.add('connected');
      const label = (info && (info.model || info.name || info.device)) || this.state.calc.getDeviceLabel();
      text.textContent = 'Connected — ' + label;
      btn.title = 'Reconnect';
    } else {
      dot.classList.remove('connected');
      text.textContent = 'Not connected';
      btn.title = 'Connect calculator';
    }
  },

  renderExplorer: function() {
    const self = this;
    const tree = document.getElementById('script-tree');
    tree.innerHTML = '';
    if (!this.state.scripts.length) {
      tree.innerHTML = '<div class="empty-state">No scripts yet</div>';
      return;
    }
    const scripts = this.state.scripts.slice().sort(function(a, b) {
      return new Date(b.updatedAt) - new Date(a.updatedAt);
    });
    scripts.forEach(function(script) {
      const versions = self.getVersions(script.id);
      const cur = script.activeVersionId
        ? self.getVersion(script.id, script.activeVersionId)
        : self.getLatest(script.id);
      const node = document.createElement('div');
      node.className = 'tree-node' + (self.state.currentScriptId === script.id ? ' active' : '');
      node.dataset.scriptId = script.id;
      node.innerHTML =
        '<button class="tree-script-row">' +
          '<span class="tree-script-left">' +
            '<span class="caret">' + icon('chevron') + '</span>' +
            icon('folder') +
            '<span class="tree-script-name">' + script.name + '</span>' +
          '</span>' +
          '<span class="tree-script-meta">' + (cur ? vLabel(cur.versionNumber) : 'draft') + '</span>' +
        '</button>' +
        '<div class="tree-versions"></div>';

      const row = node.querySelector('.tree-script-row');
      const nameEl = node.querySelector('.tree-script-name');
      row.addEventListener('click', function(e) {
        if (!e.target.closest('.tree-script-name')) node.classList.toggle('expanded');
      });
      nameEl.style.cursor = 'pointer';
      nameEl.addEventListener('click', function(e) {
        e.stopPropagation();
        self.loadVersion(script.id, script.activeVersionId || null);
      });

      const wrap = node.querySelector('.tree-versions');
      versions.forEach(function(v) {
        const ve = document.createElement('button');
        ve.dataset.versionId = v.id;
        const activeTab = self.getActiveTab();
        const isCur = activeTab && activeTab.versionId === v.id;
        ve.className = 'tree-version-row' + (isCur ? ' current' : '') + (v.published ? ' published' : '');
        const rp = self.state.restorePoints.find(function(r) { return r.versionId === v.id; });
        ve.innerHTML =
          '<span class="tree-version-left">' +
            icon('file') +
            '<span class="tree-version-name">' + script.name + ' (' + vLabel(v.versionNumber) + ')</span>' +
          '</span>' +
          '<span class="tree-version-meta">' + (rp ? '★ ' : '') + amsDisplay(new Date(v.createdAt)) + '</span>';
        ve.addEventListener('click', function() {
          node.classList.add('expanded');
          self.loadVersion(script.id, v.id);
        });
        wrap.appendChild(ve);
      });
      if (self.state.currentScriptId === script.id) node.classList.add('expanded');
      tree.appendChild(node);
    });
  },

  refreshMarket: function(force) {
    const self = this;
    const q = (document.getElementById('market-search-input').value || '').trim();
    this.state.marketQuery = q;
    if (!force && this.state.marketplaceInitialized) {
      this.renderMarket();
      return Promise.resolve();
    }
    statusPill('Loading marketplace…', 'warning');

    const tryFetch = function(branch) {
      const url = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/git/trees/' + branch + '?recursive=1';
      return fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } })
        .then(function(res) {
          if (res.status >= 400) throw new Error('GitHub ' + res.status);
          return res.json().then(function(data) {
            return { branch: branch, allFiles: data.tree || [] };
          });
        });
    };

    return tryFetch(GITHUB_BRANCH).then(function(result) {
      let py = result.allFiles.filter(function(i) {
        return i.type === 'blob' && i.path && typeof i.path === 'string' && i.path.endsWith('.py');
      });
      if (py.length === 0 && GITHUB_BRANCH.toLowerCase() === 'main') {
        return tryFetch('master').then(function(fb) {
          const fbPy = fb.allFiles.filter(function(i) {
            return i.type === 'blob' && i.path && typeof i.path === 'string' && i.path.endsWith('.py');
          });
          if (fbPy.length > 0) return { branch: 'master', allFiles: fb.allFiles, pyFiles: fbPy };
          return { branch: result.branch, allFiles: result.allFiles, pyFiles: py };
        });
      }
      return { branch: result.branch, allFiles: result.allFiles, pyFiles: py };
    }).then(function(result) {
      const py = result.pyFiles;
      const all = result.allFiles;
      const branch = result.branch;
      py.forEach(function(item) {
        const fn = item.path.split('/').pop();
        const base = fn.replace(/\.py$/i, '');
        const sl = item.path.lastIndexOf('/');
        const dir = sl >= 0 ? item.path.substring(0, sl + 1) : '';
        const pngP = dir + base + '.png';
        const jpgP = dir + base + '.jpg';
        if (all.some(function(f) { return f.path === pngP; })) {
          item.iconUrl = 'https://raw.githubusercontent.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/' + branch + '/' + pngP;
        } else if (all.some(function(f) { return f.path === jpgP; })) {
          item.iconUrl = 'https://raw.githubusercontent.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/' + branch + '/' + jpgP;
        }
        item.name = fn;
        item.__branch = branch;
      });
      return Promise.allSettled(py.slice(0, 30).map(function(item) {
        const raw = 'https://raw.githubusercontent.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/' + branch + '/' + item.path;
        return fetch(raw).then(function(r) {
          if (!r.ok) throw 0;
          return r.text();
        }).then(function(txt) {
          const fl = txt.split('\n')[0].trim();
          item.description = fl.charAt(0) === '#' ? fl.substring(1).trim() : '';
        }).catch(function() { item.description = ''; });
      })).then(function() {
        self.state.marketCache = py;
        self.state.marketplaceInitialized = true;
        statusPill(py.length + ' scripts available', 'success');
      });
    }).catch(function(e) {
      console.error('Marketplace:', e);
      self.state.marketCache = [];
      statusPill('Marketplace error: ' + e.message, 'error');
    }).then(function() {
      self.renderMarket();
    });
  },

  renderMarket: function() {
    const self = this;
    const results = document.getElementById('market-results');
    const q = (this.state.marketQuery || '').toLowerCase();
    const items = this.state.marketCache.filter(function(i) {
      if (!q) return true;
      return (i.name || '').toLowerCase().indexOf(q) !== -1 || (i.path || '').toLowerCase().indexOf(q) !== -1;
    });
    results.innerHTML = '';
    if (!this.state.marketCache.length) {
      results.innerHTML = '<div class="empty-state">No marketplace scripts found yet.</div>';
      return;
    }
    if (!items.length) {
      results.innerHTML = '<div class="empty-state">No results matched your search.</div>';
      return;
    }
    items.slice(0, 50).forEach(function(item) {
      const card = document.createElement('div');
      card.className = 'market-card';
      const iconHtml = item.iconUrl
        ? '<img src="' + item.iconUrl + '" style="width:20px;height:20px;border-radius:4px;object-fit:cover;margin-right:8px;" alt="">'
        : '';
      const descHtml = item.description ? '<div class="market-subtitle">' + item.description + '</div>' : '';
      card.innerHTML =
        '<div class="market-row">' +
          '<div style="min-width:0; display:flex; align-items:center;">' +
            iconHtml +
            '<div style="min-width:0;">' +
              '<div class="market-title">' + (item.name || 'Unknown') + '</div>' +
              descHtml +
            '</div>' +
          '</div>' +
          '<button class="market-action" title="Load">' + icon('eye') + '</button>' +
        '</div>';
      card.querySelector('.market-action').addEventListener('click', function() {
        self.loadMarket(item);
      });
      results.appendChild(card);
    });
  },

  loadMarket: function(item) {
    const self = this;
    notify('Loading script…', 'info');
    const branch = item.__branch || GITHUB_BRANCH;
    const raw = 'https://raw.githubusercontent.com/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/' + branch + '/' + item.path;
    return fetch(raw).then(function(r) {
      if (!r.ok) throw new Error('Load failed (' + r.status + ')');
      return r.text();
    }).then(function(content) {
      const tabId = self.openRemote(item.name || 'Unknown', content);
      self.setActiveTab(tabId, { force: true });
      notify('Script opened', 'success');
    }).catch(function(e) {
      notify('Load failed: ' + e.message, 'error');
    });
  },

  publish: function() {
    const self = this;
    const tab = this.getActiveTab();
    if (!tab || tab.readOnly || !tab.scriptId) {
      notify('Open a local script before publishing', 'warning');
      return;
    }
    const script = this.getScript(tab.scriptId);
    if (!script) return;

    const doPublish = function() {
      return dbGet('versions', script.activeVersionId).then(function(av) {
        if (!av) {
          notify('Save a version first', 'warning');
          return;
        }
        const endpoint = 'https://db-5-nmwrks-tkn-pldr.vercel.app/api/upload';
        const content = self.state.editor.getValue();
        const rawName = (script.name || '').trim();
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Europe/Amsterdam',
          year: 'numeric', month: 'numeric', day: 'numeric',
          hour: '2-digit', minute: '2-digit', hour12: false
        }).formatToParts(new Date());
        function pick(t) { const f = parts.find(function(p) { return p.type === t; }); return f ? f.value : ''; }
        const tsName = Number(pick('day')) + '-' + Number(pick('month')) + '-' + pick('year') + '-' + pick('hour') + ':' + pick('minute');
        const filename = rawName ? rawName.replace(/\.py$/i, '') + '.py' : tsName + '.py';

        notify('Publishing...', 'info');
        return fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: filename, content: content, commitMessage: 'Publish ' + filename })
        }).then(function(res) {
          return res.json().then(function(data) {
            if (!res.ok) throw new Error(data.error || 'Publish failed');
            av.published = true;
            av.publishedAt = new Date().toISOString();
            av.publishedPath = filename;
            return dbPut('versions', av).then(function() {
              script.published = true;
              script.publishedAt = av.publishedAt;
              return dbPut('scripts', script);
            }).then(function() {
              self.renderExplorer();
              notify('Published: ' + filename, 'success');
              const btn = document.getElementById('btn-publish');
              btn.innerHTML = icon('check');
              setTimeout(function() { setIconButton(btn, 'cloud'); }, 1400);
            });
          });
        }).catch(function(e) {
          notify('Publish failed: ' + e.message, 'error');
          const btn = document.getElementById('btn-publish');
          btn.innerHTML = icon('warning');
          setTimeout(function() { setIconButton(btn, 'cloud'); }, 1400);
        });
      });
    };

    if (tab.dirty) {
      this.saveVersion({ silent: true, force: true }).then(doPublish);
    } else {
      doPublish();
    }
  },

  exportAll: function() {
    notify('Generating backup…', 'info');
    const zip = new JSZip();
    Promise.all([dbAll('scripts'), dbAll('versions'), dbAll('restorePoints')]).then(function(res) {
      const scripts = res[0], versions = res[1], rps = res[2];
      const manifest = {
        application: 'DUB5 Python Version Manager',
        exportedAt: new Date().toISOString(),
        scripts: scripts.map(function(s) { return { id: s.id, name: s.name }; }),
        versions: versions.map(function(v) { return { id: v.id, scriptId: v.scriptId, versionNumber: v.versionNumber }; }),
        restorePoints: rps
      };
      zip.file('README.txt', 'DUB5 Python Version Manager Backup\nExported: ' + new Date().toISOString() + '\n');
      zip.file('manifest.json', JSON.stringify(manifest, null, 2));
      const scriptsFolder = zip.folder('scripts');
      const versionsFolder = zip.folder('versions');
      const rpFolder = zip.folder('restore-points');
      scripts.forEach(function(script) {
        const sv = versions.filter(function(v) { return v.scriptId === script.id; })
          .sort(function(a, b) { return b.versionNumber - a.versionNumber; });
        const latest = sv[0];
        if (latest) scriptsFolder.file(script.name, latest.sourceCode);
        const vf = versionsFolder.folder(script.name.replace(/\.py$/i, ''));
        sv.forEach(function(v) {
          const pad = String(v.versionNumber).padStart(3, '0');
          const safe = (v.displayName || 'v' + v.versionNumber).replace(/[^a-z0-9]/gi, '_').toLowerCase();
          vf.file(pad + '-' + safe + '.py', v.sourceCode);
        });
      });
      rpFolder.file('restore-points.json', JSON.stringify(rps, null, 2));
      return zip.generateAsync({ type: 'blob' });
    }).then(function(content) {
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dub5-backup-' + new Date().toISOString().split('T')[0] + '.zip';
      a.click();
      URL.revokeObjectURL(url);
      notify('Backup exported', 'success');
    }).catch(function(e) {
      notify('Export failed: ' + e.message, 'error');
    });
  },

  updateUI: function() {
    const ind = document.getElementById('unsaved-indicator');
    ind.classList.toggle('hidden', !this.state.unsavedChanges);
    const activeTab = this.getActiveTab();
    const bs = document.getElementById('btn-save-version');
    const bp = document.getElementById('btn-publish');
    const bu = document.getElementById('btn-upload');
    const si = document.getElementById('script-name-input');
    const rh = document.getElementById('readonly-hint');
    if (!activeTab) {
      bs.disabled = true; bp.disabled = true; bu.disabled = true;
      si.disabled = true; rh.classList.add('hidden');
    } else {
      bs.disabled = !!activeTab.readOnly || !activeTab.scriptId;
      bp.disabled = !!activeTab.readOnly || !activeTab.scriptId;
      bu.disabled = !!activeTab.readOnly || !activeTab.scriptId;
      si.disabled = !!activeTab.readOnly || !activeTab.scriptId;
      rh.classList.toggle('hidden', !activeTab.readOnly);
    }
  },

  showModal: function(title, fields, onSubmit) {
    const root = document.getElementById('modal-root');
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const fieldsHtml = fields.map(function(f) {
      if (f.type === 'checkbox') {
        return '<label class="modal-checkbox-label"><input type="checkbox" id="m-' + f.id + '"' + (f.checked ? ' checked' : '') + '> ' + f.label + '</label>';
      }
      return '<label for="m-' + f.id + '">' + f.label + '</label><input type="' + f.type + '" id="m-' + f.id + '" class="modal-input" placeholder="' + (f.placeholder || '') + '" value="' + (f.value || '') + '">';
    }).join('');
    overlay.innerHTML =
      '<div class="modal"><h3>' + title + '</h3>' + fieldsHtml +
      '<div class="modal-actions"><button class="cancel">Cancel</button><button class="primary confirm">Confirm</button></div></div>';
    root.appendChild(overlay);
    overlay.querySelector('.cancel').onclick = function() { overlay.remove(); };
    overlay.querySelector('.confirm').onclick = function() {
      const data = {};
      fields.forEach(function(f) {
        if (f.type === 'checkbox') data[f.id] = document.getElementById('m-' + f.id).checked ? 'on' : 'off';
        else data[f.id] = document.getElementById('m-' + f.id).value;
      });
      try {
        const r = onSubmit(data);
        if (r && r.then) r.then(function() { overlay.remove(); }).catch(function(e) {
          notify(e.message || 'Failed', 'error');
        });
        else overlay.remove();
      } catch (e) {
        notify(e.message || 'Failed', 'error');
      }
    };
    const first = overlay.querySelector('.modal-input');
    if (first) first.focus();
  }
};

// expose for debugging
window.app = app;

// boot the app
app.init();
</script>
